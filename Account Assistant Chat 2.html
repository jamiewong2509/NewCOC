<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Account Assistant Chat</title>
<style>
:root{--red:#db0011;--brand:#db0011;--brand-ink:#fff;--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#cfcfcf;--bot:#fff;--user:#efefef;--chip:#efefef;--ok:#1b6e3c;--err:#b00020;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Helvetica Neue",Arial,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:var(--bg);border-inline:1px solid var(--line)}
header{background:var(--surface);border-bottom:3px solid var(--red);padding:12px 18px;display:flex;align-items:center;gap:12px}
header b{font-size:16px}
header small{display:block;color:var(--muted);font-size:12px}
.back{border:0;background:none;color:#000;padding:4px;display:flex}
button{font:inherit;cursor:pointer}
#log{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 13px;border-radius:14px;word-wrap:break-word;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.m,.card{animation:none}}
.bot{background:var(--bot);border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start}
.usr{background:var(--user);color:#000;border:1px solid var(--line);border-top-right-radius:4px;align-self:flex-end}
.ok{border-color:var(--line)}
.ok .t{color:var(--ok);font-weight:700}
.err{border-color:var(--err)}
.typing{display:flex;gap:4px;padding:12px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.4}}
.row{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;width:88%}
.row .q{flex:1;min-width:120px}
.q{border:1px solid var(--red);background:var(--surface);color:var(--red);padding:10px 14px;border-radius:22px;font-weight:600}
.q.p{background:var(--red);color:#fff}
.q:disabled{opacity:.45;cursor:default}
.q.sel{background:var(--chip);border-color:var(--line);color:#000;opacity:1}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #000;outline-offset:2px}
.info{border:1px solid var(--red);background:#fff;color:var(--red);width:20px;height:20px;border-radius:50%;font-weight:700;font-size:12px;padding:0;vertical-align:1px;margin-left:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;border-top-left-radius:4px;padding:12px 13px;align-self:flex-start;width:100%;display:flex;flex-direction:column;gap:10px;animation:in .18s ease-out}
.card label{font-size:13px;font-weight:600}
.f{display:flex;gap:6px}
select,input.n{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px;margin-top:4px}
select{width:42%}
input.n{flex:1;min-width:0}
input.bad{border-color:var(--err)}
.hint{font-size:12px;color:var(--err);margin:0;min-height:0}
.hint:empty{display:none}
.big{font-size:15px;font-weight:700}
.slot{display:flex;flex-direction:column}
.kv{display:flex;flex-direction:column;gap:3px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.kv label{color:var(--muted);font-weight:400;font-size:13px}
.kv:last-of-type{border:0;padding-bottom:0}
.lnk{background:none;border:0;color:var(--red);font-weight:600;text-decoration:underline;padding:0;align-self:flex-start;font-size:13px}
.pop{position:fixed;z-index:5;max-width:280px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 4px 16px rgba(0,0,0,.18);font-size:14px}
.pop b{display:block;margin-bottom:4px}
.pop button{position:absolute;top:4px;right:6px;border:0;background:none;color:var(--muted);font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 18px 0}
.chips .q{white-space:nowrap;padding:6px 12px;font-size:13px;font-weight:500}
form.in{display:flex;gap:8px;align-items:center;padding:12px 18px;background:var(--surface);border-top:1px solid var(--line)}
form.in input{flex:1;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:22px;padding:11px 14px}
.ic{width:42px;height:42px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;flex:none;padding:0}
.ghost{background:none;border:0;color:var(--muted);font-size:12px;margin-left:auto;text-decoration:underline}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;z-index:9;text-align:center;gap:16px;padding:20px}
#ov .face{width:180px;height:230px;border:4px solid #fff;border-radius:50%;position:relative;overflow:hidden}
#ov .face:after{content:"";position:absolute;left:0;right:0;height:4px;background:#4cff7a;animation:sc 1.4s linear infinite}
@keyframes sc{from{top:0}to{top:100%}}
#ov button{background:none;border:0;color:#fff;text-decoration:underline}
.decl{font-size:12px;color:var(--muted);margin:0}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:6px 0}
.done b{font-size:17px;color:var(--ok)}
.done p{margin:0;font-size:14px}
.pv{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pv div{display:flex;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px}
.pv div:last-child{border:0}
.pv span{color:var(--muted);width:42%;flex:none}
.ck{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ckt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.ckl{font-size:13px;color:var(--muted)}
.ck input{width:22px;height:22px;accent-color:var(--red);flex:none;margin:0;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="back" aria-label="Back to home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <div><b>Account Assistant</b><small>Virtual Assistant</small></div>
    <button class="ghost" id="restart">Restart</button>
  </header>
  <main id="log" aria-live="polite"></main>
  <div class="chips"><button class="q" id="chipQ">Phone number enquiry</button><button class="q" id="chip">Phone number update</button></div>
  <form class="in" id="form"><input id="txt" autocomplete="off" placeholder="Type a message…" aria-label="Type a message"><button class="ic" title="Send" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button></form>
</div>
<div id="ov" role="dialog" aria-modal="true"><div class="face"></div><div>Verifying your face… please look at the camera</div><button id="ovx">Cancel</button></div>

<script src="https://cdn.jsdelivr.net/npm/libphonenumber-js@1.11.4/bundle/libphonenumber-max.js"></script>
<script>
/* ===== Phone metadata (all countries/regions) ===== */
const L = (window.libphonenumber && window.libphonenumber.parsePhoneNumberFromString) ? window.libphonenumber : null;
const DN = (() => { try { return {long: new Intl.DisplayNames(["en"], {type:"region"}), short: new Intl.DisplayNames(["en"], {type:"region", style:"short"})}; } catch(e){ return null; } })();
const rName = (iso, st = "long") => { try { return (DN && DN[st].of(iso)) || iso; } catch(e){ return iso; } };
const norm = t => t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z]/g, "");
const ALIAS = {usa:"US", us:"US", america:"US", unitedstatesofamerica:"US", uk:"GB", britain:"GB", greatbritain:"GB", england:"GB", scotland:"GB", wales:"GB", hongkong:"HK", hk:"HK", macau:"MO", macao:"MO", korea:"KR", southkorea:"KR", northkorea:"KP", uae:"AE", emirates:"AE", russia:"RU", vietnam:"VN", taiwan:"TW", china:"CN", mainlandchina:"CN", prc:"CN", holland:"NL", czechia:"CZ", turkey:"TR", ivorycoast:"CI", burma:"MM"};
const COUNTRIES = L ? L.getCountries().map(iso => {
  const name = rName(iso);
  return {iso, code: String(L.getCountryCallingCode(iso)), name, keys: [norm(name), norm(rName(iso, "short")), iso.toLowerCase()]};
}).sort((a, b) => a.name.localeCompare(b.name)) : [];

/* Current numbers on record (demo data) */
const CUR_DATA = [{e164:"+85228123456", disp:"+852 2812 3456", iso:"HK"}, {e164:"+6561234567", disp:"+65 6123 4567", iso:"SG"}];
function toObj(o){
  if (L){ const p = L.parsePhoneNumberFromString(o.e164); if (p) return {e164: p.number, disp: p.formatInternational(), iso: p.country || o.iso}; }
  return {...o};
}
const CUR = CUR_DATA.map(toObj);

/* ===== Chat helpers ===== */
const $ = s => document.querySelector(s);
const log = $("#log"), txt = $("#txt");
let state = "", fails = 0, busy = false;
const wait = ms => new Promise(r => setTimeout(r, ms));
const scroll = () => log.scrollTo({top: log.scrollHeight, behavior: "smooth"});
function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function add(cls, html){ const d = document.createElement("div"); d.className = "m " + cls; d.innerHTML = html; log.appendChild(d); scroll(); return d; }
const user = t => add("usr", esc(t));
async function bot(html, cls = ""){
  const t = add("bot typing", "<i></i><i></i><i></i>");
  await wait(650); t.remove();
  return add("bot " + cls, html);
}
function quick(opts){
  const row = document.createElement("div"); row.className = "row";
  opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "q" + (o.p ? " p" : ""); b.textContent = o.label;
    b.onclick = () => { if (busy) return; row.querySelectorAll("button").forEach(x => x.disabled = true); b.classList.add("sel"); user(o.echo || o.label); o.go(); };
    row.appendChild(b);
  });
  log.appendChild(row); scroll();
}
function lock(el){ el.querySelectorAll("button,input,select").forEach(x => x.disabled = true); }
function card(html){ const c = document.createElement("div"); c.className = "card"; c.innerHTML = html; log.appendChild(c); scroll(); return c; }

/* ===== Phase 1 ===== */
async function greet(returning){
  state = "GREETING";
  await bot(returning ? "Of course. What else can I help you with?" : "Hello, and welcome to Account Management. I'm your Account Assistant. How can I help you today?");
}
let seen = false, queue = [], curList = null;
async function askSlot(msg){
  await bot(msg || "Sure. Which office phone number would you like to update? Tick one or both, then select Continue.");
  showChecklist();
}
async function intent(){
  mode = "update";
  if (seen){ work = CUR.map(o => ({...o})); return askSlot(); }
  state = "INTENT_ACK";
  const m = await bot('I can help you with updating your office phone number. Is that what you would like to update? <button class="info" aria-label="What is this?">i</button>');
  m.querySelector(".info").onclick = e => tip(e.currentTarget);
  state = "AWAIT_DECISION";
  quick([{label:"Yes, update", p:true, go:startUpdate}, {label:"No, something else", go:altMenu}]);
}
let pop;
function tip(anchor){
  if (pop){ pop.remove(); pop = null; return; }
  pop = document.createElement("div"); pop.className = "pop"; pop.setAttribute("role", "dialog");
  pop.innerHTML = '<button aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><b>About your office phone number</b>We use your office phone number for corporate verification, urgent administrative alerts, and internal routing.';
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(r.left - 20, innerWidth - 300)) + "px";
  pop.style.top = (r.bottom + 8) + "px";
  pop.querySelector("button").onclick = () => { pop.remove(); pop = null; anchor.focus(); };
}
document.addEventListener("click", e => { if (pop && !pop.contains(e.target) && !e.target.closest(".info")){ pop.remove(); pop = null; } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && pop){ pop.remove(); pop = null; } });

/* ===== Phase 2: show numbers on record, Edit / Remove in the card ===== */
const nth = i => "office phone " + (i + 1);
const Nth = i => "Office phone " + (i + 1);
const changed = i => (work[i] ? work[i].e164 : "none") !== CUR[i].e164;
const mask = o => o.disp.replace(/^(\+\d+\s)(.*)$/, (m, a, b) => a + b.replace(/\d(?=[\d\s\-()]*\d{4}$)/g, "•"));
const region = o => o && o.iso ? rName(o.iso) : "";
let work = CUR.map(o => ({...o})), slot = 0, sel = null, removeBack = null;
const linkRow = btns => `<div style="display:flex;gap:18px;margin-top:2px">${btns}</div>`;

let mode = "update";
async function enquiryIntent(){
  mode = "enquiry"; state = "INTENT_ACK";
  const m = await bot('I can help you check the office phone numbers we have on record for you. Would you like to view them now? <button class="info" aria-label="What is this?">i</button>');
  m.querySelector(".info").onclick = e => tip(e.currentTarget);
  state = "AWAIT_ENQ_DECISION";
  quick([{label:"Yes, show me", p:true, go:showEnquiry}, {label:"No, something else", go:altMenu}]);
}
async function showEnquiry(){
  mode = "enquiry"; seen = true; work = CUR.map(o => ({...o}));
  await bot("Here are the office phone numbers we have on record for you.");
  card(CUR.map((o, i) => `<div class="kv"><label>${Nth(i)}</label><div class="big">${esc(o.disp)}</div><small style="color:var(--muted)">${esc(region(o))}</small></div>`).join(""));
  await anythingElse();
}
async function askWhich(){
  state = "AWAIT_WHICH";
  await bot("I can help you check or update your office phone number. What would you like to do?");
  quick([{label:"Check my office phone number", go:enquiryIntent}, {label:"Update my office phone number", go:intent}]);
}
async function startUpdate(){
  mode = "update";
  work = CUR.map(o => ({...o}));
  await bot("You have two office phone numbers on record with us. Tick the number you'd like to update, or tick both to update them together, then select Continue.");
  showChecklist();
}
/* Checklist: checkbox on the right of each number. After an enquiry the numbers were already shown, so only the labels appear. */
function showChecklist(){
  state = "CHOOSE_SLOT";
  const compact = seen;
  const c = card(CUR.map((o, i) => `<label class="ck"><span class="ckt"><span class="ckl">${Nth(i)}</span>${compact ? "" : `<span class="big">${esc(o.disp)}</span><small style="color:var(--muted)">${esc(region(o))}</small>`}</span><input type="checkbox" data-i="${i}" aria-label="Update ${nth(i)}"></label>`).join("")
    + '<button class="q p" id="go" disabled>Continue</button>');
  const boxes = [...c.querySelectorAll("input")], go = c.querySelector("#go");
  boxes.forEach(x => x.onchange = () => { go.disabled = !boxes.some(y => y.checked); });
  go.onclick = () => { lock(c); startQueue(boxes.filter(x => x.checked).map(x => +x.dataset.i), true); };
  curList = c;
}
const REMOVE_TIP = " If you'd like to remove office phone 2 instead of replacing it, type <b>remove</b>.";
const ccAsk = "Which country or region is the new number in? Please type the country/region name or its code, for example <b>Hong Kong</b> or <b>+852</b>.";
function removeSlot2(){
  removeFlow(() => askCountry(1, "No problem. Office phone 2 stays on file for now. " + ccAsk));
}
function startQueue(slots, echo){
  queue = [...slots];
  if (echo) user(slots.length > 1 ? "Update office phone 1 and office phone 2" : "Update " + nth(slots[0]));
  askCountry(queue[0], slots.length > 1
    ? "Let's update both numbers, one at a time, starting with office phone 1. Which country or region is the new number in? Please type the country/region name or its code, for example <b>Hong Kong</b> or <b>+852</b>."
    : undefined);
}

async function removeFlow(back){
  state = "CONFIRM_REMOVE"; removeBack = back;
  await bot("Are you sure you want to remove office phone 2? Office phone 1 will stay on file. Please type <b>Yes</b> to remove it or <b>No</b> to keep it.");
}

/* ---- Step 1: country/region (typed) ---- */
async function askCountry(i, msg){
  slot = i; sel = null; state = "ASK_CC";
  await bot((msg || `Let's update ${nth(i)}. ` + ccAsk) + (i === 1 && work[1] ? REMOVE_TIP : ""));
}
function findCountry(t){
  const raw = t.trim(), compact = raw.replace(/[\s\-()]/g, "");
  if (/^(\+|00)?\d{1,4}$/.test(compact)){
    const code = compact.replace(/^(\+|00)/, "");
    if (!L) return /^\d{1,3}$/.test(code) && code[0] !== "0" ? {code, list: []} : null;
    const list = COUNTRIES.filter(c => c.code === code);
    return list.length ? {code, list, iso: list.length === 1 ? list[0].iso : null} : null;
  }
  const k = norm(raw); if (!k || !L) return null;
  if (ALIAS[k]){ const c = COUNTRIES.find(x => x.iso === ALIAS[k]); if (c) return {code: c.code, list: [c], iso: c.iso}; }
  let m = COUNTRIES.filter(c => c.keys.includes(k));
  if (!m.length && k.length >= 3) m = COUNTRIES.filter(c => c.keys[0].startsWith(k) || c.keys[1].startsWith(k));
  if (!m.length && k.length >= 4) m = COUNTRIES.filter(c => c.keys[0].includes(k));
  if (m.length === 1) return {code: m[0].code, list: m, iso: m[0].iso};
  if (m.length > 1) return {multi: m};
  return null;
}
function selLabel(s){
  if (s.iso){ const c = s.list[0] && s.list[0].iso === s.iso ? s.list[0] : COUNTRIES.find(x => x.iso === s.iso); return `${c ? c.name : s.iso} (+${s.code})`; }
  if (!s.list.length) return "+" + s.code;
  const names = s.list.slice(0, 3).map(c => c.name).join(", ");
  return `+${s.code} (${names}${s.list.length > 3 ? " and " + (s.list.length - 3) + " more" : ""})`;
}
async function handleCountry(t){
  if (slot === 1 && /^\s*(remove|delete)\b/i.test(t)) return removeSlot2();
  const r = findCountry(t);
  if (r && r.multi){
    const shown = r.multi.slice(0, 8).map(c => `${esc(c.name)} (+${c.code})`).join("<br>");
    return bot(`I found more than one match:<br>${shown}${r.multi.length > 8 ? "<br>…" : ""}<br>Please type the full country/region name or its code.`);
  }
  if (!r) return bot(L
    ? "Sorry, I couldn't find that country or region. Please check the spelling, or type its calling code, for example <b>+852</b>."
    : "Sorry, I couldn't recognise that. Please type the country/region calling code with a plus sign, for example <b>+852</b>.", "err");
  sel = r; state = "ASK_NUM";
  await bot(`Thanks, ${esc(selLabel(r))}. Now please type your new ${nth(slot)} number without the country code. To choose a different country or region, type <b>change country</b>.`);
}

/* ---- Step 2: phone number (typed, validated) ---- */
const where = () => sel.iso ? rName(sel.iso) : "+" + sel.code;
async function handleNumber(t){
  if (slot === 1 && /^\s*(remove|delete)\b/i.test(t)) return removeSlot2();
  const raw = t.trim();
  if (/change|country|region/i.test(raw) && !/\d/.test(raw)) return askCountry(slot, "No problem. Which country or region is the new number in? Please type the name or code, for example <b>Hong Kong</b> or <b>+852</b>.");
  if (!/^[+\d\s\-().]+$/.test(raw) || !/\d/.test(raw)) return bot("Please type the phone number using digits only, for example <b>2812 3456</b>.", "err");
  let v = null;
  if (L){
    const opt = raw.startsWith("+") ? undefined : (sel.iso ? {defaultCountry: sel.iso} : {defaultCallingCode: sel.code});
    let p = null; try { p = L.parsePhoneNumberFromString(raw, opt); } catch(e){}
    if ((!p || !p.isValid()) && !raw.startsWith("+")){
      const d = raw.replace(/\D/g, "");
      if (d.startsWith(sel.code)){ try { const q = L.parsePhoneNumberFromString("+" + d); if (q && q.isValid()) p = q; } catch(e){} }
    }
    if (p && p.isValid()) v = {e164: p.number, disp: p.formatInternational(), iso: p.country || sel.iso || ""};
    else {
      let why = ""; try { why = L.validatePhoneNumberLength(raw, opt) || ""; } catch(e){}
      const msg = why === "TOO_SHORT" ? `That number looks too short for ${esc(where())}.`
        : why === "TOO_LONG" ? `That number looks too long for ${esc(where())}.`
        : `That doesn't look like a valid phone number for ${esc(where())}.`;
      return bot(msg + " Please check it and type it again, or type <b>change country</b> to pick a different country or region.", "err");
    }
  } else {
    const d = raw.replace(/\D/g, "");
    if (d.length < 4 || sel.code.length + d.length > 15) return bot("That doesn't look like a valid phone number. Please check it and type it again.", "err");
    v = {e164: "+" + sel.code + d, disp: "+" + sel.code + " " + d, iso: ""};
  }
  const other = 1 - slot;
  if (work[other] && !queue.includes(other) && v.e164 === work[other].e164) return bot(`That's the same as your ${nth(other)}. The two numbers must be different. Please type a different number.`, "err");
  if (work[slot] && v.e164 === CUR[slot].e164) return bot("That's the same as the office phone number we already have on file. Please type a different number.", "err");
  work[slot] = v; queue.shift();
  if (queue.length) return askCountry(queue[0], `Thanks. Now let's update ${nth(queue[0])}. Which country or region is the new number in? Please type the country/region name or its code, for example <b>Hong Kong</b> or <b>+852</b>.`);
  preview();
}

/* ---- Preview & confirm ---- */
async function preview(){
  state = "PREVIEW";
  await bot("Thanks. Please review your office phone numbers below. You can make more changes, or confirm to save.");
  const any = changed(0) || changed(1);
  const tag = i => !work[i] ? '<span style="color:var(--err);font-weight:600">Removed</span>' : changed(i) ? '<span style="color:var(--ok);font-weight:600">New</span>' : "No change";
  const act = i => !work[i]
    ? linkRow('<button class="lnk" data-a="undo" data-i="1">Undo removal</button><button class="lnk" data-a="edit" data-i="1">Enter a new number</button>')
    : linkRow(`<button class="lnk" data-a="edit" data-i="${i}">Edit</button>`);
  const c = card("<label>Your office phone numbers</label>" + work.map((o, i) => {
    const show = o || CUR[i];
    return `<div class="kv"><label>${Nth(i)} · ${tag(i)}</label><div class="big"${o ? "" : ' style="color:var(--muted);text-decoration:line-through"'}>${esc(show.disp)}</div><small style="color:var(--muted)">${esc(region(show))}</small>${act(i)}</div>`;
  }).join("") + `<p class="hint" style="color:var(--muted)">${any ? "" : "Make at least one change to continue."}</p><p class="decl">By selecting Confirm, you confirm that the information above is correct.</p><button class="q p" id="ok"${any ? "" : " disabled"}>Confirm</button>`);
  c.querySelectorAll(".lnk").forEach(b => b.onclick = () => {
    lock(c); const i = +b.dataset.i, a = b.dataset.a;
    if (a === "undo"){ user("Undo removal"); work[1] = {...CUR[1]}; return preview(); }
    if (a === "rm"){ user("Remove office phone 2"); return removeFlow(preview); }
    user("Edit " + nth(i)); queue = [i]; askCountry(i);
  });
  c.querySelector("#ok").onclick = () => { lock(c); user("Confirm"); fails = 0; state = "BIOMETRIC_PROMPT"; faceModal(); };
}
function faceModal(){
  const ov = $("#ov"); ov.style.display = "flex";
  const done = ok => { clearTimeout(t); ov.style.display = "none"; ok ? process() : authFail(); };
  const t = setTimeout(() => done(true), 2200);
  $("#ovx").onclick = () => done(false);
}
async function authFail(){
  fails++; state = "ERR_AUTH_FAILED";
  if (fails >= 3){
    state = "AUTH_FALLBACK";
    await bot("For your security, biometric verification is temporarily unavailable. Please use your passcode to continue.", "err");
    return quick([{label:"Enter passcode", p:true, go:process}]);
  }
  await bot("We couldn't verify your identity. Would you like to try again?", "err");
  quick([{label:"Try again", p:true, go:faceModal}, {label:"Cancel update", go:async () => { state = "CANCELLED"; await bot("Understood. I haven't made any changes to your office phone number."); anythingElse(); }}]);
}
async function process(){
  state = "PROCESSING"; busy = true;
  const t = add("bot", "Verifying…"); await wait(1100); t.remove(); busy = false;
  state = "SUBMITTED";
  const n = [0, 1].filter(changed).length;
  await bot("Thank you. Your identity has been verified.");
  card(`<div class="done"><svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="28" fill="var(--ok)"/><path d="M16 29l8 8 16-17" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Submitted</b><p>Your request to update your office phone ${n > 1 ? "numbers" : "number"} has been submitted. We will notify you via the channels decided by the bank once the update is completed.</p></div><div class="pv">` + work.map((o, i) => `<div><span>${Nth(i)}</span>${o ? esc(mask(o)) + (changed(i) ? " (update requested)" : " (unchanged)") : "Removal requested"}</div>`).join("") + "</div>");
  anythingElse();
}

/* ===== Phase 3 ===== */
async function altMenu(){
  state = "ALT_MENU";
  await bot(`No problem. Which number would you like to ${mode === "enquiry" ? "check" : "update"} instead?`);
  await bot("Please select an option:<br><b>1)</b> Phone number to receive security notifications<br><b>2)</b> Investment order phone number");
  state = "AWAIT_ALT_SELECTION";
  quick([{label:"1", go:() => redirect(1)}, {label:"2", go:() => redirect(2)}, {label:"Something else", go:liveAgentOffer}]);
}
async function redirect(n){
  state = "REDIRECT_GUIDANCE";
  const v = mode === "enquiry" ? ["check", "view"] : ["update", "update"];
  await bot(n === 1
    ? `I'm sorry, I cannot help you ${v[0]} your security notification number here. You can ${v[1]} this by going to <b>More &gt; Admin tools &amp; notifications &gt; Manage your contact information</b>.`
    : `I'm sorry, I cannot help you ${v[0]} your investment order phone number here. You can ${v[1]} this by going to <b>[path to be confirmed]</b>.`);
  anythingElse();
}
async function liveAgentOffer(){
  state = "LIVE_AGENT_OFFER";
  await bot("I'm sorry, I can't help with that here. Would you like me to connect you to a live agent?", "err");
  quick([{label:"Connect to live agent", p:true, go:async () => { state = "LIVE_AGENT_HANDOFF"; await bot("Connecting you to a live agent now. Please stay in the chat. Your conversation so far will be shared so you don't need to repeat yourself."); }}, {label:"No, thanks", go:anythingElse}]);
}

/* ===== Closure ===== */
async function anythingElse(){
  state = "ANYTHING_ELSE";
  await bot("Is there anything else I can help you with today?");
  quick([{label:"Yes", go:() => greet(true)}, {label:"No, that's all", go:end}]);
}
async function end(){
  state = "END_SESSION";
  await bot("Thank you for banking with us. Have a great day!");
}

/* ===== Typed input routing ===== */
$("#form").onsubmit = async e => {
  e.preventDefault();
  const v = txt.value.trim(); if (!v || busy) return; txt.value = "";
  log.querySelectorAll(":scope > .row button").forEach(x => x.disabled = true);
  user(v); const l = v.toLowerCase();
  switch (state){
    case "ASK_CC": return handleCountry(v);
    case "ASK_NUM": return handleNumber(v);
    case "CONFIRM_REMOVE":
      if (/^(y|yes)\b/.test(l)){ work[1] = null; queue = []; return preview(); }
      if (/^(n|no)\b/.test(l)) return removeBack();
      return bot("Please type <b>Yes</b> to remove office phone 2, or <b>No</b> to keep it.");
    case "SHOW_CURRENT": return bot("To update a number, select <b>Edit</b> next to it in the list above. To remove office phone 2, select <b>Remove</b>.");
    case "PREVIEW": return bot("Please review the numbers above, then select <b>Confirm</b>, or select <b>Edit</b> to make changes.");
    case "AWAIT_DECISION":
      if (/^(y|yes)/.test(l)) return startUpdate();
      if (/^(n|no)/.test(l)) return altMenu();
      break;
    case "CHOOSE_SLOT": {
      const done = () => curList && lock(curList);
      if (/both|all|1\s*(and|&|,|\+)\s*2|2\s*(and|&|,|\+)\s*1/.test(l)){ done(); return startQueue([0, 1]); }
      if (/^(1|one|first)\b|phone 1|number 1/.test(l)){ done(); return startQueue([0]); }
      if (/^(2|two|second)\b|phone 2|number 2/.test(l)){ done(); return startQueue([1]); }
      return bot("Please tick the number you'd like to update and select Continue. You can also type <b>1</b>, <b>2</b> or <b>both</b>.", "err");
    }
    case "AWAIT_ENQ_DECISION":
      if (/^(y|yes)/.test(l)) return showEnquiry();
      if (/^(n|no)/.test(l)) return altMenu();
      break;
    case "AWAIT_WHICH":
      if (/check|enquir|inquir|view|see|show/.test(l)) return enquiryIntent();
      if (/update|change|edit/.test(l)) return intent();
      break;
    case "AWAIT_ALT_SELECTION":
      if (/^1\b/.test(l)) return redirect(1);
      if (/^2\b/.test(l)) return redirect(2);
      return liveAgentOffer();
    case "ANYTHING_ELSE":
      if (/^(y|yes)/.test(l)) return greet(true);
      if (/^(n|no)/.test(l)) return end();
  }
  if (["GREETING", "ANYTHING_ELSE", "END_SESSION", "AWAIT_WHICH"].includes(state)){
    if (/enquir|inquir|check|view|see|show|look ?up|what('?s| is| are)/.test(l)) return enquiryIntent();
    if (/update|change|edit|amend|replace|remove/.test(l)) return intent();
    if (/phone|number|contact/.test(l)) return askWhich();
  }
  bot("Sorry, I didn't catch that. Could you rephrase?");
};
$("#chipQ").onclick = () => { txt.value = "Phone number enquiry"; $("#form").requestSubmit(); };
$("#chip").onclick = () => { txt.value = "Phone number update"; $("#form").requestSubmit(); };
$("#restart").onclick = () => { log.innerHTML = ""; seen = false; fails = 0; greet(false); };
greet(false);
</script>
